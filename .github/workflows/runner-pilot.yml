name: Runner pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-pilot
  cancel-in-progress: false
jobs:
  export-library:
    name: Cold export-library (${{ matrix.provider }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: github
            runner: ubuntu-24.04
          - provider: blacksmith
            runner: blacksmith-4vcpu-ubuntu-2404
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Record host
        run: |
          mkdir -p source results gomod gobuild
          uname -srm > results/host.txt
          lscpu >> results/host.txt
          free -h >> results/host.txt
          docker version >> results/host.txt
          date -u +%FT%TZ > results/job-start.txt
      - name: Prepare pinned source and container
        run: |
          start=$SECONDS
          curl -fsSL https://codeload.github.com/DynamicalSystemsGroup/OpenSysML/tar.gz/4748cc352aeacc5e14cf3ebdbd3ed8dd16c042e0 -o source.tar.gz
          echo '98c8ed968cee621a66e725751cde204da8804e25329fcae3dc17a27aac1930a9  source.tar.gz' | sha256sum -c -
          tar -xzf source.tar.gz --strip-components=1 -C source
          docker pull golang@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
          echo "prepare_seconds=$((SECONDS-start))" > results/preparation.txt
      - name: Run bounded cold shard
        run: |
          docker run --rm --name runner-pilot --user "$(id -u):$(id -g)" -e HOME=/tmp -e GOCACHE=/cache/gobuild --cpus=4 --memory=10g --pids-limit=512 --security-opt=no-new-privileges --cap-drop=ALL \
            -v "$PWD/source:/work" -v "$PWD/results:/results" -v "$PWD/gomod:/go/pkg/mod" -v "$PWD/gobuild:/cache/gobuild" \
            -w /work golang@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea \
            bash -lc 'export PATH=/usr/local/go/bin:$PATH; export GOTOOLCHAIN=local; id > /results/container-user.txt; test -w /results && test -w /work && test -w /go/pkg/mod && test -w /cache/gobuild || exit 70; date -u > /results/start.txt; go version > /results/toolchain.txt; start=$SECONDS; go mod download > /results/modules.log 2>&1; rc=$?; echo "modules_seconds=$((SECONDS-start)) exit=$rc" > /results/timing.txt; if [ "$rc" -ne 0 ]; then exit "$rc"; fi; start=$SECONDS; timeout 1200 make test-shard SHARD=export-library > /results/export-library.log 2>&1; rc=$?; echo "shard_seconds=$((SECONDS-start)) exit=$rc" >> /results/timing.txt; date -u > /results/end.txt; cat /results/timing.txt; tail -8 /results/export-library.log; exit "$rc"'
      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runner-pilot-${{ matrix.provider }}
          path: results/
          retention-days: 7
